<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c4b">
  <title>北海道旅行指南｜選擇版本</title>
  <style>
    :root{--ink:#173c4b;--lake:#2b7182;--mist:#edf5f5;--paper:#fffdf8;--gold:#d9aa52;--line:#d7e2df}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;color:var(--ink);background:linear-gradient(145deg,#e7f2f2,#fffaf0);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.7}
    main{width:min(900px,calc(100% - 32px));margin:auto;padding:clamp(52px,10vw,110px) 0}
    header{max-width:680px;margin-bottom:34px}
    .eyebrow{color:var(--lake);font-size:.78rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(2.35rem,7vw,4.8rem);line-height:1.08}
    header p{margin:0;color:#60757a;font-size:1.05rem}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    article{display:flex;flex-direction:column;min-height:280px;padding:28px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,248,.94);box-shadow:0 16px 44px rgba(23,60,75,.10)}
    .tag{align-self:flex-start;padding:4px 10px;border-radius:999px;color:white;background:var(--lake);font-size:.75rem;font-weight:800}
    article:last-child .tag{color:#453511;background:var(--gold)}
    h2{margin:18px 0 8px;font-size:1.42rem;line-height:1.35}
    article p{margin:0 0 24px;color:#60757a}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:auto;padding:10px 18px;border-radius:12px;color:white;background:var(--ink);font-weight:800;text-decoration:none}
    a:hover{background:var(--lake)}
    footer{margin-top:28px;color:#6c7e82;font-size:.84rem}
    @media(max-width:680px){.grid{grid-template-columns:1fr}article{min-height:230px}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Japan Travel · Hokkaido</div>
      <h1>兩份北海道旅行指南</h1>
      <p>原版與新版都完整保留，請依使用情境選擇。</p>
    </header>
    <section class="grid" aria-label="指南版本">
      <article>
        <span class="tag">原版保留</span>
        <h2>北海道 8 日自駕指南</h2>
        <p>原先已上傳的完整旅遊指南，檔案內容未修改。</p>
        <a href="./北海道8日自駕指南.html">開啟原版指南</a>
      </article>
      <article>
        <span class="tag">新增公開離線版</span>
        <h2>2026 北海道家庭旅行</h2>
        <p>針對 iPhone 16 Pro 與離線閱讀整理，已移除姓名、聯絡資料、票號及私人訂位資訊；地圖與外部連結仍需網路。</p>
        <a href="./北海道旅行_2026_iPhone16Pro_最終離線版.html">開啟新版離線指南</a>
      </article>
    </section>
    <footer>兩份 HTML 均為獨立檔案，可分別下載與保存。</footer>
  </main>
</body>
</html>
